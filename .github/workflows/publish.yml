name: Publish signed Android APK
on:
  push:
    branches: [main]
    paths: [release.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-android-apk
  queue: max

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify and publish signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 publish.py
